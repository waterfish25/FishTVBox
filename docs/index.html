<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7ed8">
  <title>FishTVBox · 在线演示</title>
  <meta name="description" content="FishTVBox 家庭电视盒界面静态演示：左侧 IPTV 频道墙与今日回看，右侧电影海报与 B 站短视频。">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/launcher.css">
  <style>
    body.tv .stage-idle {
      background:
        linear-gradient(180deg, rgba(4, 12, 30, 0.28) 0%, rgba(4, 12, 30, 0.72) 100%),
        radial-gradient(420px 240px at 50% 62%, rgba(96, 140, 255, 0.2), transparent 68%),
        url("assets/stage.jpg") center 42% / cover no-repeat;
    }
    body.tv .demo-badge {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffcf7d, #ff9550);
      color: #3a1a04;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }
    body.tv .github-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 11px;
      border-radius: 9px;
      border: 1px solid rgba(47, 126, 216, 0.18);
      background: #f3f9ff;
      color: #2f66a4;
      font-size: 11.5px;
      text-decoration: none;
      white-space: nowrap;
    }
    body.tv .github-link:hover {
      background: #fff;
      color: #1c5fae;
    }
    body.tv .github-link svg {
      width: 16px;
      height: 16px;
    }
    .demo-toast {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%);
      z-index: 60;
      max-width: 76vw;
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(8, 20, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #eaf4ff;
      font-size: 12px;
      box-shadow: 0 14px 34px rgba(4, 18, 48, 0.4);
    }
    @media (max-width: 900px) {
      body.tv .demo-badge { display: none; }
    }
  </style>
</head>
<body class="tv">
  <div class="tv-app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5"></path>
            <path d="M5 9.8V20h5v-5h4v5h5V9.8"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>FishTVBox</h1>
          <p>家庭电视盒</p>
        </div>
        <span class="demo-badge">静态演示</span>
      </div>

      <div class="top-status">
        <span class="status-pill ok"><i></i><span>演示频道已就绪</span></span>
        <span class="top-sep" aria-hidden="true"></span>
        <span class="date-text" id="dateText">--月--日</span>
        <span class="clock" id="clock">--:--</span>
      </div>

      <nav class="top-actions">
        <a class="github-link" href="https://github.com/waterfish25/FishTVBox" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.15-1.11-1.46-1.11-1.46-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85V21c0 .27.18.58.69.48A10 10 0 0 0 12 2z"></path>
          </svg>
          GitHub 仓库
        </a>
      </nav>
    </header>

    <main class="launcher">
      <section class="panel iptv-panel">
        <div class="panel-head">
          <div class="panel-title">
            <span class="live-dot" aria-hidden="true"></span>
            <h2>电视频道</h2>
            <span class="tag">演示直播源</span>
          </div>
          <div class="head-actions">
            <span class="src-address">IPTV · M3U / TXT</span>
          </div>
        </div>

        <div class="stage" id="stage" tabindex="0" aria-label="直播预览">
          <div class="stage-idle" id="stageIdle">
            <div class="idle-clock" id="idleClock">--:--</div>
            <p class="idle-title">选择频道开始观看</p>
            <p class="idle-sub">方向键移动焦点 · 确认键播放 · 返回键退出</p>
          </div>
          <div class="stage-topline" id="stageTopline" hidden>
            <span class="now-badge" id="nowBadge">LIVE</span>
            <div class="now-copy">
              <div class="now-title" id="nowTitle"></div>
              <div class="now-program" id="nowProgram"></div>
            </div>
          </div>
        </div>

        <div class="catchup-strip">
          <div class="catchup-head">
            <span class="catchup-title">今天回看</span>
            <small id="catchupDate">今天</small>
            <span class="catchup-hint" id="catchupHint">选择频道后显示今日节目单</span>
          </div>
          <div class="catchup-list" id="catchupList">
            <button class="catchup-item"><span class="ci-time">09:00</span><span class="ci-title">早间新闻</span></button>
            <button class="catchup-item"><span class="ci-time">12:00</span><span class="ci-title">午间剧场</span></button>
            <button class="catchup-item is-live"><span class="ci-time">18:30</span><span class="ci-title">生活纪实</span></button>
            <button class="catchup-item is-future"><span class="ci-time">20:00</span><span class="ci-title">黄金影院</span></button>
          </div>
        </div>

        <div class="channel-block">
          <div class="cats" id="categories">
            <button class="cat-pill is-active">全部 12</button>
            <button class="cat-pill">央视 4</button>
            <button class="cat-pill">卫视 6</button>
            <button class="cat-pill">地方 2</button>
          </div>
          <div class="channel-grid" id="channelGrid">
            <button class="channel-card is-active" data-name="CCTV-1 综合" data-program="正在播 · 新闻联播">
              <span class="ch-logo">C1</span><span class="ch-name">CCTV-1</span>
            </button>
            <button class="channel-card" data-name="CCTV-5 体育" data-program="正在播 · 赛事直播">
              <span class="ch-logo">C5</span><span class="ch-name">CCTV-5</span>
            </button>
            <button class="channel-card" data-name="湖南卫视" data-program="正在播 · 综艺现场">
              <span class="ch-logo">湖</span><span class="ch-name">湖南卫视</span>
            </button>
            <button class="channel-card" data-name="东方卫视" data-program="正在播 · 都市剧场">
              <span class="ch-logo">东</span><span class="ch-name">东方卫视</span>
            </button>
            <button class="channel-card" data-name="江苏卫视" data-program="正在播 · 晚间综艺">
              <span class="ch-logo">苏</span><span class="ch-name">江苏卫视</span>
            </button>
            <button class="channel-card" data-name="浙江卫视" data-program="正在播 · 中国蓝剧场">
              <span class="ch-logo">浙</span><span class="ch-name">浙江卫视</span>
            </button>
            <button class="channel-card" data-name="北京卫视" data-program="正在播 · 纪实节目">
              <span class="ch-logo">京</span><span class="ch-name">北京卫视</span>
            </button>
            <button class="channel-card" data-name="广东卫视" data-program="正在播 · 岭南文化">
              <span class="ch-logo">粤</span><span class="ch-name">广东卫视</span>
            </button>
            <button class="channel-card" data-name="深圳卫视" data-program="正在播 · 晚间新闻">
              <span class="ch-logo">深</span><span class="ch-name">深圳卫视</span>
            </button>
            <button class="channel-card" data-name="少儿频道" data-program="正在播 · 动画乐园">
              <span class="ch-logo">少</span><span class="ch-name">少儿频道</span>
            </button>
            <button class="channel-card" data-name="凤凰中文" data-program="正在播 · 时事直通车">
              <span class="ch-logo">凤</span><span class="ch-name">凤凰中文</span>
            </button>
            <button class="channel-card" data-name="芒果 TV" data-program="正在播 · 综艺精选">
              <span class="ch-logo">芒</span><span class="ch-name">芒果 TV</span>
            </button>
          </div>
        </div>
      </section>

      <section class="panel movies-panel">
        <div class="panel-head">
          <div class="panel-title">
            <span class="section-mark"></span>
            <h2>电影</h2>
            <span class="tag">苹果 CMS 示例</span>
          </div>
          <div class="head-actions">
            <button class="mini-btn" data-demo="搜索电影：实际容器内连接电影源">搜索</button>
            <button class="mini-btn" data-demo="刷新电影列表">刷新</button>
          </div>
        </div>
        <div class="poster-grid" id="movieGrid">
          <button class="poster-card" data-demo="演示影片《深空回响》">
            <img src="assets/poster-1.jpg" alt="深空回响海报">
            <span class="poster-shade"></span>
            <span class="poster-meta"><span class="poster-name">深空回响</span><span class="poster-note">科幻 · 2026</span></span>
            <span class="poster-remark">HD</span>
          </button>
          <button class="poster-card" data-demo="演示影片《雨夜列车》">
            <img src="assets/poster-2.jpg" alt="雨夜列车海报">
            <span class="poster-shade"></span>
            <span class="poster-meta"><span class="poster-name">雨夜列车</span><span class="poster-note">悬疑 · 2025</span></span>
            <span class="poster-remark">蓝光</span>
          </button>
          <button class="poster-card" data-demo="演示影片《山海之间》">
            <img src="assets/poster-3.jpg" alt="山海之间海报">
            <span class="poster-shade"></span>
            <span class="poster-meta"><span class="poster-name">山海之间</span><span class="poster-note">剧情 · 2024</span></span>
            <span class="poster-remark">HD</span>
          </button>
          <button class="poster-card" data-demo="演示影片《霓虹追缉》">
            <img src="assets/stage.jpg" alt="霓虹追缉海报">
            <span class="poster-shade"></span>
            <span class="poster-meta"><span class="poster-name">霓虹追缉</span><span class="poster-note">动作 · 2026</span></span>
            <span class="poster-remark">新片</span>
          </button>
        </div>
      </section>

      <section class="panel shorts-panel">
        <div class="panel-head">
          <div class="panel-title">
            <span class="section-mark warm"></span>
            <h2>B站短视频</h2>
            <span class="tag">热门</span>
          </div>
          <div class="head-actions">
            <button class="mini-btn" data-demo="换一批 B 站热门视频">换一批</button>
          </div>
        </div>
        <div class="short-grid" id="shortGrid">
          <button class="short-card" data-demo="演示短视频：夜市烟火">
            <span class="short-thumb">
              <img src="assets/poster-2.jpg" alt="夜市烟火">
              <span class="short-duration">03:24</span>
              <span class="short-play">▶</span>
            </span>
            <span class="short-meta"><span class="short-title">夜市烟火：一口铁锅里的城市温度</span><span class="short-owner">@美食记录</span></span>
          </button>
          <button class="short-card" data-demo="演示短视频：海岸线延时">
            <span class="short-thumb">
              <img src="assets/stage.jpg" alt="海岸线延时">
              <span class="short-duration">01:58</span>
              <span class="short-play">▶</span>
            </span>
            <span class="short-meta"><span class="short-title">海岸线延时：城市入夜的一分钟</span><span class="short-owner">@城市影像</span></span>
          </button>
        </div>
      </section>

      <div class="app-column">
        <button class="app-tile tile-settings" data-demo="实际容器访问 /settings 配置直播源与电影源">
          <span class="app-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3.2"></circle>
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V22h-4v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H2v-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H8a1.7 1.7 0 0 0 1-1.5V2h4v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V8a1.7 1.7 0 0 0 1.5 1H22v4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
            </svg>
          </span>
          <span class="app-name">电脑设置</span>
          <span class="app-sub">配置直播源与电影源</span>
        </button>
        <button class="app-tile tile-remote" data-demo="实际容器访问 /remote 使用手机遥控">
          <span class="app-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="2" width="12" height="20" rx="3"></rect>
              <path d="M11 18h2"></path>
            </svg>
          </span>
          <span class="app-name">手机遥控</span>
          <span class="app-sub">同一局域网扫码使用</span>
        </button>
      </div>

      <nav class="quick-row">
        <button class="quick-tile q-orange" data-focus="#channelGrid">
          <span class="quick-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="4" width="19" height="13" rx="2.5"></rect>
              <path d="M8 21h8M12 17v4"></path>
            </svg>
          </span>
          <span class="quick-name">全部频道</span>
        </button>
        <button class="quick-tile q-coral" data-focus="#catchupList">
          <span class="quick-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7v5l3.2 2"></path>
            </svg>
          </span>
          <span class="quick-name">今日回看</span>
        </button>
        <button class="quick-tile q-pink" data-focus="#movieGrid">
          <span class="quick-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"></rect>
              <path d="M2.5 9h19M7 4.5l2.5 4.5M14 4.5l2.5 4.5"></path>
            </svg>
          </span>
          <span class="quick-name">电影</span>
        </button>
        <button class="quick-tile q-rose" data-focus="#shortGrid">
          <span class="quick-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"></rect>
              <path d="m10 8.5 6 3.5-6 3.5z"></path>
            </svg>
          </span>
          <span class="quick-name">B站短视频</span>
        </button>
        <button class="quick-tile q-blue" data-demo="完整镜像：ghcr.io/waterfish25/fishtvbox:latest">
          <span class="quick-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="2"></rect>
              <rect x="14" y="3" width="7" height="7" rx="2"></rect>
              <rect x="3" y="14" width="7" height="7" rx="2"></rect>
              <rect x="14" y="14" width="7" height="7" rx="2"></rect>
            </svg>
          </span>
          <span class="quick-name">更多应用</span>
        </button>
      </nav>
    </main>

    <footer class="tv-footer">
      <div class="footer-hint">静态演示 · 实际容器支持直播、今日回看、电影源、B 站短视频与手机遥控</div>
      <div class="footer-right">
        <span>ghcr.io/waterfish25/fishtvbox:latest</span>
        <span class="conn-dot">演示模式</span>
      </div>
    </footer>
  </div>

  <div class="demo-toast" id="demoToast" hidden></div>

  <script>
    (() => {
      const $ = (sel, root = document) => root.querySelector(sel);
      const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
      let toastTimer = null;

      function showToast(message) {
        const node = $('#demoToast');
        node.textContent = message;
        node.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { node.hidden = true; }, 3200);
      }

      function updateClock() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const text = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
        $('#clock').textContent = text;
        $('#idleClock').textContent = text;
        $('#dateText').textContent = `${pad(now.getMonth() + 1)}月${pad(now.getDate())}日 周${'日一二三四五六'[now.getDay()]}`;
      }

      $$('.channel-card').forEach((card) => {
        card.addEventListener('click', () => {
          $$('.channel-card').forEach((item) => item.classList.remove('is-active'));
          card.classList.add('is-active');
          $('#nowTitle').textContent = card.dataset.name;
          $('#nowProgram').textContent = card.dataset.program || '正在播 · 演示节目';
          $('#stageTopline').hidden = false;
          $('#catchupHint').textContent = `${card.dataset.name} · 今日节目单`;
        });
      });

      $$('.cat-pill').forEach((pill) => {
        pill.addEventListener('click', () => {
          $$('.cat-pill').forEach((item) => item.classList.remove('is-active'));
          pill.classList.add('is-active');
          showToast(`演示站：分类「${pill.textContent.trim()}」仅展示样式`);
        });
      });

      $$('.catchup-item').forEach((item) => {
        item.addEventListener('click', () => {
          $$('.catchup-item').forEach((node) => node.classList.remove('is-active'));
          item.classList.add('is-active');
          showToast('演示站：实际容器会回看当天节目');
        });
      });

      $$('[data-demo]').forEach((node) => {
        node.addEventListener('click', () => showToast(node.dataset.demo));
      });

      $$('[data-focus]').forEach((node) => {
        node.addEventListener('click', () => {
          const target = $(node.dataset.focus);
          target?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          const first = target?.querySelector('button');
          first?.focus({ preventScroll: true });
        });
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') $('#demoToast').hidden = true;
      });

      updateClock();
      setInterval(updateClock, 15000);
    })();
  </script>
</body>
</html>
