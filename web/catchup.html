<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7ed8">
  <title>电视回放 · FishTVBox</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/vendor/hls.min.js" defer></script>
  <script src="/js/tv-common.js" defer></script>
  <script src="/js/catchup.js" defer></script>
</head>
<body class="tv">
  <div class="catchup-view" id="catchupView">
    <header class="app-view-head">
      <div class="app-view-title">
        <span class="view-mark catchup">CLOCK</span>
        <div>
          <h2>电视回放</h2>
          <p>今天节目单 · 选择节目回看</p>
        </div>
      </div>
      <div class="app-view-actions">
        <button class="mini-btn" data-nav id="btnCatchupHome">返回主页</button>
      </div>
    </header>
    <div class="catchup-view-body">
      <div class="home-channel-grid catchup-channels" id="catchupChannels"></div>
      <div class="catchup-head">
        <span class="catchup-title">今天回看</span>
        <small id="catchupDate"></small>
        <span class="catchup-hint" id="catchupHint">选择频道后显示今日节目单</span>
      </div>
      <div class="catchup-list" id="catchupList"></div>
    </div>
  </div>

  <div class="player-modal" id="playerModal" hidden>
    <div class="player-modal-head">
      <div>
        <h3 id="modalTitle">回看播放</h3>
        <p id="modalSub"></p>
      </div>
      <button class="overlay-close" data-nav id="modalClose" aria-label="关闭">✕</button>
    </div>
    <div class="player-frame" id="playerFrame">
      <video id="modalVideo" playsinline preload="none"></video>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</body>
</html>
