<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7ed8">
  <title>视频 · FishTVBox</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/tv-common.js" defer></script>
  <script src="/js/bili.js" defer></script>
</head>
<body class="tv">
  <div class="bili-view" id="biliView">
    <header class="app-view-head">
      <div class="app-view-title">
        <span class="bili-mark">B</span>
        <div>
          <h2>哔哩哔哩 · 热门</h2>
          <p>方向键选择 · OK 播放 · 主页键返回主页</p>
        </div>
      </div>
      <div class="app-view-actions">
        <button class="mini-btn" data-nav id="btnBiliRefresh">换一批</button>
        <button class="mini-btn" data-nav id="btnBiliHome">返回主页</button>
      </div>
    </header>
    <div class="short-grid bili-grid" id="shortGrid"></div>
    <div class="empty-state" id="shortEmpty" hidden>
      <span class="empty-kicker">SHORTS</span>
      <h3>短视频加载失败</h3>
      <p id="shortEmptyText">B 站接口暂时不可用，稍后再试。</p>
      <button class="solid-btn" data-nav id="btnShortsEmptyRefresh">重试</button>
    </div>
  </div>

  <div class="player-modal" id="playerModal" hidden>
    <div class="player-modal-head">
      <div>
        <h3 id="modalTitle">播放中</h3>
        <p id="modalSub"></p>
      </div>
      <button class="overlay-close" data-nav id="modalClose" aria-label="关闭">✕</button>
    </div>
    <div class="player-frame" id="playerFrame">
      <div class="bili-frame" id="modalIframe" hidden></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</body>
</html>
