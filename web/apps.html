<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7ed8">
  <title>全部应用 · FishTVBox</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/tv-common.js" defer></script>
  <script src="/js/apps.js" defer></script>
</head>
<body class="tv">
  <div class="apps-view" id="appsView">
    <header class="app-view-head">
      <div class="app-view-title">
        <span class="view-mark apps">APP</span>
        <div>
          <h2>应用</h2>
          <p>方向键选择 · OK 打开 · 主页键返回主页</p>
        </div>
      </div>
      <div class="app-view-actions">
        <button class="mini-btn" data-nav id="btnAppsHome">返回主页</button>
      </div>
    </header>
    <div class="apps-grid-big">
      <button class="app-tile tile-bili" data-nav id="biliAppTile">
        <span class="app-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5.5" width="18" height="13" rx="3"></rect>
            <path d="M8 2.5 10.5 5M16 2.5 13.5 5M8.5 11h.01M15.5 11h.01M9 15h6"></path>
          </svg>
        </span>
        <span class="app-name">哔哩哔哩</span>
        <span class="app-sub">热门短视频</span>
      </button>
      <button class="app-tile tile-search" data-nav id="searchAppTile">
        <span class="app-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="m15.5 15.5 4 4"></path>
          </svg>
        </span>
        <span class="app-name">搜索</span>
        <span class="app-sub">查找电影</span>
      </button>
      <button class="app-tile tile-settings" data-nav id="settingsAppTile">
        <span class="app-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.2"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V22h-4v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H2v-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H8a1.7 1.7 0 0 0 1-1.5V2h4v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V8a1.7 1.7 0 0 0 1.5 1H22v4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
          </svg>
        </span>
        <span class="app-name">设置</span>
        <span class="app-sub">配置源地址</span>
      </button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</body>
</html>
