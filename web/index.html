<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7ed8">
  <title>FishTVBox · 家庭电视盒</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/vendor/hls.min.js" defer></script>
  <script src="/js/tv-common.js" defer></script>
  <script src="/js/home.js" defer></script>
</head>
<body class="tv">
  <div class="tv-app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5"></path>
            <path d="M5 9.8V20h5v-5h4v5h5V9.8"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1 id="siteTitle">FishTVBox</h1>
          <p id="siteSubtitle">家庭电视盒</p>
        </div>
      </div>

      <div class="top-status">
        <span class="status-pill" id="liveStatus"><i></i><span>直播源准备中</span></span>
        <span class="top-sep" aria-hidden="true"></span>
        <span class="date-text" id="dateText">--月--日</span>
        <span class="clock" id="clock">--:--</span>
      </div>

      <nav class="top-actions">
        <button class="icon-btn" data-nav id="btnGuide" aria-label="遥控与地址" title="遥控与地址">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="3"></rect>
            <path d="M8 9h.01M12 9h.01M16 9h.01M8 14h.01M12 14h.01M16 14h.01"></path>
          </svg>
        </button>
        <button class="icon-btn" data-nav id="btnReload" aria-label="刷新内容" title="刷新内容">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3.2-6.9"></path>
            <path d="M21 4v5h-5"></path>
          </svg>
        </button>
        <button class="icon-btn" data-nav id="btnSettings" aria-label="电脑设置" title="电脑设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.2"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V22h-4v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H2v-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H8a1.7 1.7 0 0 0 1-1.5V2h4v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V8a1.7 1.7 0 0 0 1.5 1H22v4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
          </svg>
        </button>
      </nav>
    </header>

    <main class="launcher">
      <section class="panel iptv-panel">
        <div class="panel-head">
          <div class="panel-title">
            <span class="live-dot" aria-hidden="true"></span>
            <h2>电视频道</h2>
            <span class="tag" id="iptvSourceName">加载中</span>
          </div>
          <div class="head-actions">
            <span class="src-address" id="iptvAddress">直播访问地址</span>
            <button class="mini-btn" data-nav id="btnIptvRefresh">刷新</button>
          </div>
        </div>

        <div class="stage" id="stage" data-nav tabindex="0" aria-label="直播播放器">
          <video id="tvVideo" playsinline preload="none"></video>
          <div class="stage-idle" id="stageIdle">
            <div class="idle-clock" id="idleClock">--:--</div>
            <p class="idle-title">选择频道开始观看</p>
            <p class="idle-sub">方向键移动焦点 · 确认键播放 · 返回键退出</p>
          </div>
          <div class="stage-topline" id="stageTopline" hidden>
            <span class="now-badge" id="nowBadge">LIVE</span>
            <div class="now-copy">
              <div class="now-title" id="nowTitle"></div>
              <div class="now-program" id="nowProgram"></div>
            </div>
          </div>
          <div class="stage-controls" id="stageControls" hidden>
            <button class="ctrl-btn" data-nav id="btnPlay">暂停</button>
            <button class="ctrl-btn" data-nav id="btnMute">静音</button>
            <button class="ctrl-btn" data-nav id="btnFullscreen">全屏</button>
            <span class="player-state" id="playerState"></span>
          </div>
          <div class="stage-error" id="stageError" hidden></div>
        </div>

        <div class="empty-state" id="iptvEmpty" hidden>
          <span class="empty-kicker">IPTV</span>
          <h3>直播源暂无频道</h3>
          <p id="iptvEmptyText">请到电脑端配置页更换直播源地址。</p>
          <button class="solid-btn" data-nav id="btnIptvEmptyRefresh">重新加载</button>
        </div>
      </section>

      <div class="home-entries">
        <button class="home-entry" data-nav id="catchupEntry" aria-label="打开电视回放">
          <span class="entry-icon catchup">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 7.5V12l3 1.8"></path>
              <path d="M3.5 12a8.5 8.5 0 0 1 1.6-5"></path>
              <path d="m3 3.5.2 3.4 3.4-.2"></path>
            </svg>
          </span>
          <span class="entry-text"><span class="entry-label">电视回放</span><span class="entry-desc">今天节目单 · 可回看</span></span>
          <span class="entry-arrow" aria-hidden="true">›</span>
        </button>

        <button class="home-entry" data-nav id="movieEntry" aria-label="打开电影">
          <span class="entry-icon films">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="5" width="19" height="14" rx="2.5"></rect>
              <path d="M7.5 5v14M16.5 5v14M2.5 9.5h5M2.5 14.5h5M16.5 9.5h5M16.5 14.5h5"></path>
            </svg>
          </span>
          <span class="entry-text"><span class="entry-label">电影</span><span class="entry-desc">海报电影库</span></span>
          <span class="entry-arrow" aria-hidden="true">›</span>
        </button>

        <button class="home-entry" data-nav id="videoEntry" aria-label="打开视频">
          <span class="entry-icon video">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="4.5" width="19" height="15" rx="3.5"></rect>
              <path d="m10 8.8 5.2 3.2-5.2 3.2z" fill="currentColor" stroke="none"></path>
            </svg>
          </span>
          <span class="entry-text"><span class="entry-label">视频</span><span class="entry-desc">哔哩哔哩热门</span></span>
          <span class="entry-arrow" aria-hidden="true">›</span>
        </button>
      </div>

      <div class="home-channels">
        <div class="home-channel-grid" id="homeChannelGrid"></div>
        <button class="home-quick" data-nav id="remoteEntry" aria-label="打开虚拟遥控">
          <span class="quick-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6.5" y="2.5" width="11" height="19" rx="2.5"></rect>
              <path d="M10.5 18h3"></path>
            </svg>
          </span>
          <span class="quick-name">虚拟遥控</span>
        </button>
      </div>

      <button class="home-allapps" data-nav id="appsEntry" aria-label="打开全部应用">
        <span class="entry-icon apps">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7.5" height="7.5" rx="2"></rect>
            <rect x="13.5" y="3" width="7.5" height="7.5" rx="2"></rect>
            <rect x="3" y="13.5" width="7.5" height="7.5" rx="2"></rect>
            <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"></rect>
          </svg>
        </span>
        <span class="entry-label">全部应用</span>
        <span class="entry-arrow" aria-hidden="true">›</span>
      </button>
    </main>

    <footer class="tv-footer">
      <div class="footer-hint">方向键移动 · 确认键播放 · 返回键上一层 · 手机遥控 <b id="remoteUrl">/remote</b></div>
      <div class="footer-right">
        <span id="sourceFooter"></span>
        <span class="conn-dot" id="connState">遥控就绪</span>
      </div>
    </footer>
  </div>

  <div class="live-fullscreen" id="liveFullscreen" hidden>
    <video id="fsVideo" playsinline preload="none"></video>
    <div class="fs-top">
      <span class="now-badge" id="fsBadge">LIVE</span>
      <div class="fs-copy">
        <div class="fs-title" id="fsTitle">电视频道</div>
        <div class="fs-program" id="fsProgram"></div>
      </div>
      <div class="fs-clock" id="fsClock">--:--</div>
    </div>
    <div class="fs-osd" id="fsOsd" hidden></div>
    <div class="fs-hints" id="fsHints">OK 节目列表 · ↑↓ 换台 · 数字键选台 · +/- 音量 · 主页键返回</div>
    <div class="channel-switcher" id="channelSwitcher" hidden>
      <div class="cs-head">
        <h3>节目列表</h3>
        <span id="csMeta">方向键选择 · OK 播放 · 返回键收起</span>
      </div>
      <div class="cs-grid" id="channelSwitcherGrid"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-backdrop" id="overlayBackdrop"></div>
    <div class="overlay-card" id="overlayCard" role="dialog" aria-modal="true">
      <button class="overlay-close" data-nav id="overlayClose" aria-label="关闭">✕</button>
      <div id="overlayBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</body>
</html>
