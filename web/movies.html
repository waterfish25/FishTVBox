<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7ed8">
  <title>电影 · FishTVBox</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/vendor/hls.min.js" defer></script>
  <script src="/js/tv-common.js" defer></script>
  <script src="/js/movies.js" defer></script>
</head>
<body class="tv">
  <div class="movies-view" id="moviesView">
    <header class="app-view-head">
      <div class="app-view-title">
        <span class="view-mark films">FILM</span>
        <div>
          <h2>电影</h2>
          <p id="movieSourceName">加载中</p>
        </div>
      </div>
      <div class="app-view-actions">
        <button class="mini-btn" data-nav id="btnMovieSearch">搜索</button>
        <button class="mini-btn" data-nav id="btnMovieRefresh">刷新</button>
        <button class="mini-btn" data-nav id="btnMoviesHome">返回主页</button>
      </div>
    </header>
    <div class="poster-grid" id="movieGrid"></div>
    <div class="empty-state" id="movieEmpty" hidden>
      <span class="empty-kicker">MOVIES</span>
      <h3>还没有电影源</h3>
      <p id="movieEmptyText">在电脑打开配置页，添加苹果 CMS 接口即可。</p>
      <button class="solid-btn" data-nav id="btnMovieEmptyGuide">前往电脑设置</button>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-backdrop" id="overlayBackdrop"></div>
    <div class="overlay-card" id="overlayCard" role="dialog" aria-modal="true">
      <button class="overlay-close" data-nav id="overlayClose" aria-label="关闭">✕</button>
      <div id="overlayBody"></div>
    </div>
  </div>

  <div class="player-modal" id="playerModal" hidden>
    <div class="player-modal-head">
      <div>
        <h3 id="modalTitle">播放中</h3>
        <p id="modalSub"></p>
      </div>
      <button class="overlay-close" data-nav id="modalClose" aria-label="关闭">✕</button>
    </div>
    <div class="player-frame" id="playerFrame">
      <video id="modalVideo" playsinline preload="none"></video>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</body>
</html>
