services:
  fishtvbox:
    build: .
    image: ghcr.io/waterfish25/fishtvbox:latest
    container_name: fishtvbox
    restart: unless-stopped
    ports:
      - "8686:8686"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8686/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
